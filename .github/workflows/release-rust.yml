name: Rust Desktop Release

# Model-Gate Rust 桌面版发布流水线：
#   - 推送 v* tag（如 v2.19.0）触发构建并发布 GitHub Release；
#   - 手动 workflow_dispatch 默认只构建产物（可勾选 publish 一并发布）。
# 版本唯一源：rust/model-gate/Cargo.toml；tag 触发时校验 tag == v<version>。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: "创建 GitHub Release（默认仅构建产物）"
        type: boolean
        default: false

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 构建 Rust 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/model-gate

      - name: 读取版本并校验 tag
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $text = Get-Content "rust\model-gate\Cargo.toml" -Raw -Encoding UTF8
          if ($text -notmatch '(?m)^\s*version\s*=\s*"([^"]+)"') { throw "version not found in rust/model-gate/Cargo.toml" }
          $ver = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "tag $($env:GITHUB_REF_NAME) does not match v$ver"
          }
          Write-Host "version: $ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed: $LASTEXITCODE" }

      - name: cargo build --release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --manifest-path rust/model-gate/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "rust/model-gate/target/release/model-gate.exe" "dist/Model-Gate-rust.exe" -Force

      - name: 安装 Node（UI 冒烟与迁移冒烟需要 Node 22+）
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 后端测试
        shell: pwsh
        working-directory: rust/model-gate
        run: |
          $ErrorActionPreference = "Stop"
          cargo test
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed: $LASTEXITCODE" }

      - name: 面板资源语法检查
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem "rust/model-gate/ui/v3*.js" | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "syntax check failed: $($_.Name)" }
          }
          node --check scripts/ui_smoke_v3.js
          if ($LASTEXITCODE -ne 0) { throw "ui_smoke_v3.js syntax check failed" }

      - name: 面板 API 冒烟
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/panel_api_smoke.ps1 -Exe dist/Model-Gate-rust.exe -Port 18941
          if ($LASTEXITCODE -ne 0) { throw "panel API smoke failed: $LASTEXITCODE" }

      - name: 面板 v3 冒烟
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tmp = Join-Path $env:RUNNER_TEMP "mg-v3-smoke"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $config = '{"host":"127.0.0.1","port":18943,"upstreams":{"demo":{"protocol":"openai","baseUrl":"http://127.0.0.1:65535","apiKeyStore":"upstream:demo","template":"openai","kind":"official","label":"演示上游","privacy":{"zdr":true,"training":"deny"},"models":["demo-model"]}}}'
          Set-Content -Path "$tmp\bridge.config.json" -Value $config -Encoding utf8
          $p = Start-Process "dist\Model-Gate-rust.exe" -ArgumentList @('--config', "$tmp\bridge.config.json", '--db', "$tmp\modelgate.db", '--port', '18943', '--no-gui', '--no-browser', '--force-multi') -PassThru -WindowStyle Hidden -RedirectStandardOutput "$tmp\server.out.log" -RedirectStandardError "$tmp\server.err.log"
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try { $null = Invoke-RestMethod 'http://127.0.0.1:18943/health'; $ready = $true; break } catch { Start-Sleep -Milliseconds 300 }
            }
            if (-not $ready) { throw "v3 smoke server not ready" }
            node scripts/ui_smoke_v3.js --base http://127.0.0.1:18943 --screenshot-dir "$tmp\screenshots"
            if ($LASTEXITCODE -ne 0) { throw "v3 UI smoke failed: $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 历史数据库迁移冒烟
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/db_migration_smoke.js --exe dist/Model-Gate-rust.exe --port 18950
          if ($LASTEXITCODE -ne 0) { throw "DB migration smoke failed: $LASTEXITCODE" }

      - name: 打包安装包（Inno Setup）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\rust\model-gate\build-installer.ps1 -Version "${{ steps.meta.outputs.version }}"
          $setup = "dist\Model-Gate-v${{ steps.meta.outputs.version }}-rust-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer missing: $setup" }
          if (-not (Test-Path "dist\Model-Gate-rust.exe")) { throw "portable exe missing" }
          $size = (Get-Item $setup).Length
          if ($size -gt 6MB) { throw ("installer exceeds 6MB: {0:N2} MB" -f ($size / 1MB)) }
          "installer_size_mb={0:N2}" -f ($size / 1MB) | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $setupName = Split-Path $setup -Leaf
          "$hash  $setupName" | Out-File -FilePath "dist\SHA256SUMS" -Encoding ascii
          $manifest = Get-Content "dist\SHA256SUMS" -Raw -Encoding ASCII
          $expected = "$hash  $setupName"
          if ($manifest.Trim() -ne $expected.Trim()) { throw "SHA256SUMS mismatch: $manifest" }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: rust-installer
          path: |
            dist/Model-Gate-v${{ steps.meta.outputs.version }}-rust-setup.exe
            dist/Model-Gate-rust.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: 发布 GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: Model-Gate v${{ steps.meta.outputs.version }} (Rust)
          body: |
            Model-Gate v3.1：v3 成为唯一控制台，旧面板功能全量并入 12 个子视图。
            Rust 桌面版：托盘常驻 + 系统浏览器面板（无内嵌 WebView2）。

            - **唯一控制台**：`/ui/` 即 v3 控制台；`/ui/classic` 仅做 308 永久跳转，旧面板资源从仓库与运行时移除。
            - **12 个子视图 / 5 个分区**：总览、全部接入、模型与定价、路由组、凭据池、插件、免费来源、ZCode、用量分析、提示词、运行日志、设置。
            - **全功能并入**：模型目录与定价、路由组、用量与请求明细、提示词演进与差异、免费来源、ZCode 账号池、运行日志、备份恢复、配置说明与更新检查。
            - **高级编辑**：接入详情抽屉支持模型/别名/覆盖、`compat`、`timeoutSeconds`、`sessionHeader` 等字段，`null` 可清除可选字段。
            - **兼容承诺**：`bridge.config.json` 仍是唯一事实源；`/v1`、`/{upstream}/v1`、`/unified/v1`、`/unified/{group}/v1` 与旧配置读取全部保留；SQLite 只追加新表。
            - 安装包：`Model-Gate-v${{ steps.meta.outputs.version }}-rust-setup.exe`（安装时可选安装目录）
            - 便携版：`Model-Gate-rust.exe`（单文件，免安装）
            - 校验：`SHA256SUMS`
            - 应用内更新会下载安装包并校验 `SHA256SUMS`；便携版请手动运行安装包。
          generate_release_notes: true
          draft: false
          files: |
            dist/Model-Gate-v${{ steps.meta.outputs.version }}-rust-setup.exe
            dist/Model-Gate-rust.exe
            dist/SHA256SUMS
