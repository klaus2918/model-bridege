name: Rust Desktop Release

# Model-Gate Rust 桌面版发布流水线（多端）：
#   - 推送 v* tag（如 v4.7.0）触发构建并发布 GitHub Release；
#   - Windows：Inno Setup 安装包 + 便携 exe（build job）；
#   - Linux：model-gate + panel-gpui 的 tar.gz（build-linux job，在 build 之后追加到同一 Release）；
#   - 手动 workflow_dispatch 默认只构建产物（可勾选 publish 一并发布）。
# 版本唯一源：rust/model-gate/Cargo.toml；tag 触发时校验 tag == v<version>。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: "创建 GitHub Release（默认仅构建产物）"
        type: boolean
        default: false

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 构建 Rust 安装包
    runs-on: windows-latest
    env:
      # sccache：跨 run 复用编译单元。只靠 rust-cache 缓存 target 的话，
      # 换依赖或 runner 环境变化后依然会全量重编。
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/model-gate

      - name: 安装 sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: 校验 sccache 可用
        shell: pwsh
        # 缓存后端（ghac）偶发不可用时，sccache 连 `rustc -vV` 都会以退出码 2 结束，
        # 把整条流水线拖垮（v4.0.1 前三次都挂在这）。
        # 注意：不能直接探 `rustc -vV`——RUSTC_WRAPPER 只作用于 cargo 调起的 rustc，
        # 手跑 rustc 根本不经过 sccache，探测永远“通过”。必须探 sccache 客户端本身。
        run: |
          $ErrorActionPreference = "Continue"
          & sccache --start-server 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            "RUSTC_WRAPPER=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Warning "sccache 缓存后端不可用，本次构建回退到直连 rustc"
          } else {
            Write-Host "sccache 可用"
          }
          # GitHub 会在这段脚本尾部注入 `exit $LASTEXITCODE`；探测失败时的非零退出码
          # 不清掉，会把“回退成功”也判成步骤失败（第三次就栽在这一行）。
          $global:LASTEXITCODE = 0

      - name: 启用 LLD 链接器
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/enable-lld.ps1

      - name: 读取版本并校验 tag
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $text = Get-Content "rust\model-gate\Cargo.toml" -Raw -Encoding UTF8
          if ($text -notmatch '(?m)^\s*version\s*=\s*"([^"]+)"') { throw "version not found in rust/model-gate/Cargo.toml" }
          $ver = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "tag $($env:GITHUB_REF_NAME) does not match v$ver"
          }
          Write-Host "version: $ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed: $LASTEXITCODE" }

      - name: cargo build --release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --manifest-path rust/model-gate/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "rust/model-gate/target/release/model-gate.exe" "dist/Model-Gate-rust.exe" -Force

      - name: 安装 Node（UI 冒烟与迁移冒烟需要 Node 22+）
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 后端测试
        shell: pwsh
        working-directory: rust/model-gate
        run: |
          $ErrorActionPreference = "Stop"
          $out = & cargo test 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            # 失败原因以注解形式回传：公开可读，本地不必下载日志
            ($out -split "`r?`n") | Where-Object { $_ -match 'FAILED|panicked at|error\[' } |
              Select-Object -First 8 | ForEach-Object { Write-Host "::error::$($_.Trim())" }
            throw "cargo test failed: $LASTEXITCODE"
          }

      - name: 面板资源语法检查
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem "rust/model-gate/ui/v4*.js" | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "syntax check failed: $($_.Name)" }
          }
          node --check scripts/ui_smoke_v4.js
          if ($LASTEXITCODE -ne 0) { throw "ui_smoke_v4.js syntax check failed" }

      - name: 面板 API 冒烟
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/panel_api_smoke.ps1 -Exe dist/Model-Gate-rust.exe -Port 18941 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            ($out -split "`r?`n") | Where-Object { $_ -match '\[FAIL\]|失败项|Exception|ParserError' } |
              Select-Object -First 8 | ForEach-Object { Write-Host "::error::$($_.Trim())" }
            throw "panel API smoke failed: $LASTEXITCODE"
          }

      - name: 面板 v4 冒烟
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tmp = Join-Path $env:RUNNER_TEMP "mg-v4-smoke"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $config = '{"host":"127.0.0.1","port":18943,"upstreams":{"demo":{"protocol":"openai","baseUrl":"http://127.0.0.1:65535","apiKeyStore":"upstream:demo","template":"openai","kind":"official","label":"演示上游","privacy":{"zdr":true,"training":"deny"},"models":["demo-model"]}}}'
          Set-Content -Path "$tmp\bridge.config.json" -Value $config -Encoding utf8
          $p = Start-Process "dist\Model-Gate-rust.exe" -ArgumentList @('--config', "$tmp\bridge.config.json", '--db', "$tmp\modelgate.db", '--port', '18943', '--no-gui', '--no-browser', '--force-multi') -PassThru -WindowStyle Hidden -RedirectStandardOutput "$tmp\server.out.log" -RedirectStandardError "$tmp\server.err.log"
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try { $null = Invoke-RestMethod 'http://127.0.0.1:18943/health'; $ready = $true; break } catch { Start-Sleep -Milliseconds 300 }
            }
            if (-not $ready) { throw "v4 smoke server not ready" }
            $out = & node scripts/ui_smoke_v4.js --base http://127.0.0.1:18943 --screenshot-dir "$tmp\screenshots" 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) {
              ($out -split "`r?`n") | Where-Object { $_ -match '^ - |\[FATAL\]|结果：' } |
                Select-Object -First 10 | ForEach-Object { Write-Host "::error::$($_.Trim())" }
              throw "v4 UI smoke failed: $LASTEXITCODE"
            }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 历史数据库迁移冒烟
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/db_migration_smoke.js --exe dist/Model-Gate-rust.exe --port 18950
          if ($LASTEXITCODE -ne 0) { throw "DB migration smoke failed: $LASTEXITCODE" }

      - name: 打包安装包（Inno Setup）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\rust\model-gate\build-installer.ps1 -Version "${{ steps.meta.outputs.version }}"
          $setup = "dist\Model-Gate-v${{ steps.meta.outputs.version }}-rust-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer missing: $setup" }
          if (-not (Test-Path "dist\Model-Gate-rust.exe")) { throw "portable exe missing" }
          $size = (Get-Item $setup).Length
          if ($size -gt 6MB) { throw ("installer exceeds 6MB: {0:N2} MB" -f ($size / 1MB)) }
          "installer_size_mb={0:N2}" -f ($size / 1MB) | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $setupName = Split-Path $setup -Leaf
          "$hash  $setupName" | Out-File -FilePath "dist\SHA256SUMS" -Encoding ascii
          $manifest = Get-Content "dist\SHA256SUMS" -Raw -Encoding ASCII
          $expected = "$hash  $setupName"
          if ($manifest.Trim() -ne $expected.Trim()) { throw "SHA256SUMS mismatch: $manifest" }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: rust-installer
          path: |
            dist/Model-Gate-v${{ steps.meta.outputs.version }}-rust-setup.exe
            dist/Model-Gate-rust.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: 发布 GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: Model-Gate v${{ steps.meta.outputs.version }} (Rust)
          body: |
            Model-Gate v4.7：密钥来源互斥四选一（加密库 / 环境变量 / 凭据文件）、
            路由组对齐设计意图、GPUI 原生面板（panel-gpui）与 Linux 产物。
            Rust 桌面版：托盘常驻 + 系统浏览器面板（无内嵌 WebView2）。

            - **密钥四选一（互斥）**：接入详情与添加向导可选「本机加密库（推荐）/ 写入用户环境变量 / 写入凭据文件」，保存后只保留所选来源——保存 key 不再把 env 模式静默覆盖成加密库（Linux 环境变量写入 ~/.bashrc 托管块）。
            - **路由组对齐设计意图**：成员写法统一为 上游/模型（UI 选择器同步），modelMap 别名不再误报警告，`/v1/models` 不再列出全员不可解析的空组，删除接入自动清理分组引用。
            - **GPUI 原生面板 panel-gpui**：独立进程调用网关 /api，五页（工作台 / 接入管理 / 路由与分组 / 用量 / 日志）；密钥永不经过面板。
            - **Linux 支持**：网关可无托盘运行，随 Release 提供 `Model-Gate-v*-linux-x86_64.tar.gz`（含 model-gate 与 panel-gpui）。

            - **控制台 v4（唯一入口）**：`/ui/` 即 v4 控制台，v3 面板资源从仓库与运行时移除；6 个一级入口 + 配置中心，总览/用量/提示词/接入管理 1 次点击可达，任意对象 1 次点击打开统一抽屉。
            - **深浅双主题**：正文对比度 16.4 / 14.5，浅色 `#F4F1E8` 与深色 `#0A0E0D` 各一套令牌；1440 / 1024 / 390 三档布局。
            - **请求体上限 `maxBodyBytes`**：默认 64 MiB，多模态请求（内联 base64 图片）不再被 axum 的 2 MiB 默认上限挡成 413；超限回 OpenAI 形状 JSON 并写 warn 日志，面板 `/api/*` 同步抬到 64 MiB。
            - **运行日志尾读**：只读文件末尾 512 KiB，长日志自动刷新不再整文件搬运。
            - **ZCode 通道加固**：启动等待 3s→8s、RPC 超时 30s→60s、回合超时 150s→600s；按 `sessionId` 过滤事件、丢弃 `reasoning_delta`（思考过程不再混进正文）、`turn.completed` 兜底最终文本；Start Plan 账户注入兜底模型。
            - **兼容承诺**：`bridge.config.json` 仍是唯一事实源；`/v1`、`/{upstream}/v1`、`/unified/v1`、`/unified/{group}/v1` 与旧配置读取全部保留；SQLite 只追加新表。
            - 安装包：`Model-Gate-v${{ steps.meta.outputs.version }}-rust-setup.exe`（安装时可选安装目录）
            - 便携版：`Model-Gate-rust.exe`（单文件，免安装）
            - 校验：`SHA256SUMS`
            - 应用内更新会下载安装包并校验 `SHA256SUMS`；便携版请手动运行安装包。
          generate_release_notes: true
          draft: false
          files: |
            dist/Model-Gate-v${{ steps.meta.outputs.version }}-rust-setup.exe
            dist/Model-Gate-rust.exe
            dist/SHA256SUMS

  build-linux:
    name: 构建 Linux 产物（网关 + GPUI 面板）
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/model-gate
            rust/panel-gpui

      - name: 安装构建依赖（GPUI 面板需要）
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: 读取版本并校验 tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ver=$(grep -m1 '^version' rust/model-gate/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match v${ver}" >&2
            exit 1
          fi
          echo "version: ${ver}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: 后端测试（Linux 语义：env/file 来源可用）
        shell: bash
        working-directory: rust/model-gate
        run: |
          set -euo pipefail
          out=$(cargo test 2>&1) || { echo "$out" | tail -30; exit 1; }
          echo "$out" | grep -E "test result" | tail -3

      - name: 构建网关与 GPUI 面板
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path rust/model-gate/Cargo.toml
          cargo build --release --manifest-path rust/panel-gpui/Cargo.toml
          mkdir -p dist
          cp rust/model-gate/target/release/model-gate dist/model-gate
          cp rust/panel-gpui/target/release/panel-gpui dist/panel-gpui

      - name: 打包 Linux tar.gz
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.meta.outputs.version }}"
          mkdir -p "pkg/Model-Gate-v${ver}-linux-x86_64"
          cp dist/model-gate dist/panel-gpui "pkg/Model-Gate-v${ver}-linux-x86_64/"
          cat > "pkg/Model-Gate-v${ver}-linux-x86_64/README.txt" <<'EOF'
          Model-Gate Linux (x86_64)

          1) 启动网关（默认 127.0.0.1:8900，托盘不可用时自动退化为纯代理模式）：
             ./model-gate
          2) 启动 GPUI 原生面板（需图形会话；连接 http://127.0.0.1:8900）：
             ./panel-gpui
          3) 密钥来源推荐「写入用户环境变量」（写入 ~/.bashrc 托管块）
             或「写入凭据文件」；本机加密库仅支持 Windows DPAPI。
          EOF
          tar -czf "dist/Model-Gate-v${ver}-linux-x86_64.tar.gz" -C pkg "Model-Gate-v${ver}-linux-x86_64"
          hash=$(sha256sum "dist/Model-Gate-v${ver}-linux-x86_64.tar.gz" | awk '{print $1}')
          echo "${hash}  Model-Gate-v${ver}-linux-x86_64.tar.gz" > dist/SHA256SUMS-linux
          cat dist/SHA256SUMS-linux

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            dist/Model-Gate-v${{ steps.meta.outputs.version }}-linux-x86_64.tar.gz
            dist/SHA256SUMS-linux
          if-no-files-found: error
          retention-days: 7

      - name: 发布 Linux 产物到 Release
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          files: |
            dist/Model-Gate-v${{ steps.meta.outputs.version }}-linux-x86_64.tar.gz
            dist/SHA256SUMS-linux
