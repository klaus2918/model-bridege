[package]
name = "model-gate"
version = "4.6.0"
edition = "2021"
description = "Model-Gate 本地模型网关（Rust 实现）"
license = "MIT"

[[bin]]
name = "model-gate"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "net", "sync", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
futures-util = "0.3"
bytes = "1"
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"
arc-swap = "1"
semver = "1"
sha2 = "0.10"
base64 = "0.22"
tray-icon = "0.19"
tracing-appender = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"
png = "0.17"

[dev-dependencies]
# tower::util::ServiceExt::oneshot：接口层测试直接调用 router，不起真实端口。
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
# opt-level=3 而非 "s"：网关的每请求成本主要是 JSON 解析与 SSE 流处理，
# 体积导向的 "s" 会明显放大这部分 CPU；安装包略大几 MB 可接受。
opt-level = 3
# thin LTO：跨 crate 内联带来的运行时收益，编译时间增量可控。
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
incremental = false
